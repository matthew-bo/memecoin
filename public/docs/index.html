<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Vote Token Documentation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1976d2;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .doc-card {
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .doc-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }
        .doc-title {
            color: #1976d2;
            margin-top: 0;
        }
        .doc-description {
            color: #666;
        }
        .btn {
            display: inline-block;
            background-color: #1976d2;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0d47a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Popular Vote Token Documentation</h1>
        
        <div class="doc-card">
            <h2 class="doc-title">Whitepaper</h2>
            <p class="doc-description">
                A comprehensive overview of the Popular Vote Token, including the token economics, platform functionality, and governance framework.
            </p>
            <a href="whitepaper.pdf" class="btn" target="_blank">View Whitepaper</a>
            <a href="whitepaper.pdf" class="btn" download>Download PDF</a>
        </div>
        
        <!-- You can add more documentation cards here as needed -->
    </div>
</body>
</html>
