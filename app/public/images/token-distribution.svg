<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: 'Segoe UI', Arial, sans-serif;
      fill: #333;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      fill: #1976d2;
    }
    .legend-title {
      font-size: 16px;
      font-weight: bold;
    }
    .legend-text {
      font-size: 14px;
    }
    .annotation {
      font-size: 14px;
      fill: #666;
    }
  </style>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">$VOTE Token Distribution</text>
  
  <!-- Pie Chart -->
  <g transform="translate(300, 300)">
    <!-- Community Rewards: 50% -->
    <path d="M0,0 L180,0 A180,180 0 0,1 -180,0 z" fill="#1976d2" />
    
    <!-- Development Fund: 20% -->
    <path d="M0,0 L-180,0 A180,180 0 0,1 -111.6,-141.1 z" fill="#4caf50" />
    
    <!-- Founding Team: 15% -->
    <path d="M0,0 L-111.6,-141.1 A180,180 0 0,1 55.2,-171.7 z" fill="#ff9800" />
    
    <!-- Ecosystem Growth: 10% -->
    <path d="M0,0 L55.2,-171.7 A180,180 0 0,1 155.9,-90 z" fill="#f44336" />
    
    <!-- Liquidity Provision: 5% -->
    <path d="M0,0 L155.9,-90 A180,180 0 0,1 180,0 z" fill="#9c27b0" />
  </g>
  
  <!-- Annotations -->
  <text x="425" y="220" class="annotation">Community Rewards</text>
  <text x="445" y="240" class="annotation">50%</text>
  <line x1="400" y1="230" x2="350" y2="250" stroke="#1976d2" stroke-width="2" />
  
  <text x="175" y="175" class="annotation">Development Fund</text>
  <text x="195" y="195" class="annotation">20%</text>
  <line x1="220" y1="180" x2="250" y2="220" stroke="#4caf50" stroke-width="2" />
  
  <text x="250" y="100" class="annotation">Founding Team</text>
  <text x="270" y="120" class="annotation">15%</text>
  <line x1="290" y1="110" x2="250" y2="180" stroke="#ff9800" stroke-width="2" />
  
  <text x="450" y="130" class="annotation">Ecosystem Growth</text>
  <text x="470" y="150" class="annotation">10%</text>
  <line x1="440" y1="140" x2="370" y2="180" stroke="#f44336" stroke-width="2" />
  
  <text x="550" y="210" class="annotation">Liquidity</text>
  <text x="545" y="230" class="annotation">Provision</text>
  <text x="570" y="250" class="annotation">5%</text>
  <line x1="540" y1="230" x2="450" y2="260" stroke="#9c27b0" stroke-width="2" />
  
  <!-- Legend -->
  <rect x="550" y="300" width="20" height="20" fill="#1976d2" />
  <text x="580" y="315" class="legend-text">Community Rewards (50%)</text>
  
  <rect x="550" y="330" width="20" height="20" fill="#4caf50" />
  <text x="580" y="345" class="legend-text">Development Fund (20%)</text>
  
  <rect x="550" y="360" width="20" height="20" fill="#ff9800" />
  <text x="580" y="375" class="legend-text">Founding Team (15%)</text>
  
  <rect x="550" y="390" width="20" height="20" fill="#f44336" />
  <text x="580" y="405" class="legend-text">Ecosystem Growth (10%)</text>
  
  <rect x="550" y="420" width="20" height="20" fill="#9c27b0" />
  <text x="580" y="435" class="legend-text">Liquidity Provision (5%)</text>
  
  <text x="650" y="470" class="annotation">Total Supply: 100,000,000 VOTE</text>
</svg> 