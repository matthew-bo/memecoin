<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#1976d2">Voting Mechanism Flow</text>

  <!-- Step 1: Poll Selection -->
  <circle cx="120" cy="120" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">1. Poll</text>
  <text x="120" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Selection</text>

  <!-- Step 2: Verification -->
  <circle cx="240" cy="120" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="240" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">2. Candidate</text>
  <text x="240" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Verification</text>

  <!-- Step 3: Voting Period -->
  <circle cx="360" cy="120" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="360" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">3. Voting</text>
  <text x="360" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Period</text>

  <!-- Step 4: Token Holding Verification -->
  <circle cx="480" cy="120" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">4. Token</text>
  <text x="480" y="132" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Holding</text>
  <text x="480" y="152" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Verification</text>

  <!-- Step 5: Result Tabulation -->
  <circle cx="600" cy="120" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">5. Result</text>
  <text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Tabulation</text>

  <!-- Step 6: Reward Distribution -->
  <circle cx="720" cy="120" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="720" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">6. Reward</text>
  <text x="720" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Distribution</text>

  <!-- Flow arrows -->
  <line x1="170" y1="120" x2="190" y2="120" stroke="#1976d2" stroke-width="2"/>
  <polygon points="190,120 185,115 185,125" fill="#1976d2"/>
  
  <line x1="290" y1="120" x2="310" y2="120" stroke="#1976d2" stroke-width="2"/>
  <polygon points="310,120 305,115 305,125" fill="#1976d2"/>
  
  <line x1="410" y1="120" x2="430" y2="120" stroke="#1976d2" stroke-width="2"/>
  <polygon points="430,120 425,115 425,125" fill="#1976d2"/>
  
  <line x1="530" y1="120" x2="550" y2="120" stroke="#1976d2" stroke-width="2"/>
  <polygon points="550,120 545,115 545,125" fill="#1976d2"/>
  
  <line x1="650" y1="120" x2="670" y2="120" stroke="#1976d2" stroke-width="2"/>
  <polygon points="670,120 665,115 665,125" fill="#1976d2"/>

  <!-- Validation Process -->
  <rect x="120" y="220" width="600" height="120" rx="10" ry="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="420" y="250" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1976d2">Validation Process</text>
  
  <text x="150" y="280" font-family="Arial" font-size="14" fill="#333">1. User connects wallet containing $VOTE tokens</text>
  <text x="150" y="305" font-family="Arial" font-size="14" fill="#333">2. User casts vote for their chosen candidate</text>
  <text x="150" y="330" font-family="Arial" font-size="14" fill="#333">3. Vote is recorded but remains in "pending" status for 24 hours</text>
  <text x="420" y="280" font-family="Arial" font-size="14" fill="#333">4. System verifies user still holds tokens after period</text>
  <text x="420" y="305" font-family="Arial" font-size="14" fill="#333">5. If verification passes, vote is counted</text>
  <text x="420" y="330" font-family="Arial" font-size="14" fill="#333">6. If verification fails, vote is discarded</text>

  <!-- Legend -->
  <rect x="650" y="360" width="20" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="680" y="375" font-family="Arial" font-size="12" fill="#333">Process Step</text>
</svg> 