<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#1976d2">$VOTE Token Flow</text>

  <!-- Circle layout for token flow -->
  <circle cx="400" cy="200" r="140" fill="none" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Step 1: Initial Distribution -->
  <circle cx="400" cy="60" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">1. Initial</text>
  <text x="400" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Distribution</text>

  <!-- Step 2: Voting Power -->
  <circle cx="550" cy="130" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="550" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">2. Voting</text>
  <text x="550" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Power</text>

  <!-- Step 3: Rewards -->
  <circle cx="550" cy="270" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="550" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">3. Rewards</text>
  <text x="550" y="285" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Distribution</text>

  <!-- Step 4: Staking -->
  <circle cx="400" cy="340" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">4. Staking</text>
  <text x="400" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Mechanisms</text>

  <!-- Step 5: Verification -->
  <circle cx="250" cy="270" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="250" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">5. Token</text>
  <text x="250" y="285" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Verification</text>

  <!-- Step 6: Platform Fees -->
  <circle cx="250" cy="130" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="250" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">6. Platform</text>
  <text x="250" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976d2">Fees</text>

  <!-- Center logo -->
  <circle cx="400" cy="200" r="40" fill="#1976d2"/>
  <text x="400" y="205" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff">$VOTE</text>

  <!-- Flow arrows -->
  <line x1="400" y1="110" x2="425" y2="135" stroke="#1976d2" stroke-width="2"/>
  <polygon points="425,135 415,135 425,125" fill="#1976d2"/>
  
  <line x1="500" y1="130" x2="525" y2="130" stroke="#1976d2" stroke-width="2"/>
  <polygon points="525,130 520,125 520,135" fill="#1976d2"/>
  
  <line x1="550" y1="180" x2="550" y2="220" stroke="#1976d2" stroke-width="2"/>
  <polygon points="550,220 545,215 555,215" fill="#1976d2"/>
  
  <line x1="500" y1="270" x2="450" y2="300" stroke="#1976d2" stroke-width="2"/>
  <polygon points="450,300 455,290 460,300" fill="#1976d2"/>
  
  <line x1="400" y1="290" x2="350" y2="270" stroke="#1976d2" stroke-width="2"/>
  <polygon points="350,270 360,265 360,275" fill="#1976d2"/>
  
  <line x1="250" y1="220" x2="250" y2="180" stroke="#1976d2" stroke-width="2"/>
  <polygon points="250,180 245,185 255,185" fill="#1976d2"/>
  
  <line x1="300" y1="130" x2="350" y2="100" stroke="#1976d2" stroke-width="2"/>
  <polygon points="350,100 340,105 345,115" fill="#1976d2"/>

  <!-- Legend -->
  <rect x="650" y="360" width="20" height="20" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="680" y="375" font-family="Arial" font-size="12" fill="#333">Token Flow Stage</text>
</svg> 