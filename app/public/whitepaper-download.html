<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Vote Platform - Whitepaper</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
            margin-top: 50px;
        }
        h1 {
            color: #1976d2;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 40px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-top: 40px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 250px;
        }
        .primary {
            background-color: #1976d2;
            color: white;
            box-shadow: 0 4px 6px rgba(25, 118, 210, 0.2);
        }
        .primary:hover {
            background-color: #1565c0;
            box-shadow: 0 6px 10px rgba(25, 118, 210, 0.3);
            transform: translateY(-2px);
        }
        .secondary {
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }
        .secondary:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }
        .icon {
            margin-right: 10px;
            font-size: 1.5em;
        }
        p {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        .footer {
            margin-top: 50px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

<body>
    <div class="container">
        <h1>Popular Vote Platform Whitepaper</h1>
        
        <p>

            a decentralized voting system powered by Solana blockchain technology.
        </p>
        
        <div class="button-container">
            <a href="whitepaper-enhanced.pdf" class="button primary" download>
                <span class="icon">📥</span> Download PDF Version
            </a>
            <a href="whitepaper.html" class="button secondary">
                <span class="icon">🔗</span> View HTML Version
            </a>

</html>
