[package]
name = "memecoin-vote"
version = "0.1.0"
edition = "2021"
description = "Memecoin with voting functionality for daily polls"

[lib]
crate-type = ["cdylib", "lib"]
name = "memecoin_vote"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
solana-program = "=1.16.0"
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
thiserror = "1.0.40"
spl-token = { version = "3.5.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "1.1.3", features = ["no-entrypoint"] } 